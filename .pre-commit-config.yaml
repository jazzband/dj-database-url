repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
        args:
          - --quiet

  - repo: https://github.com/crate-ci/typos
    rev: typos-dict-v0.14.2
    hooks:
      - id: typos
