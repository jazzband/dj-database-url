name: test
on: [push, pull_request]
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run ruff
        run: uv run ruff check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Run mypy
        run: uv run mypy dj_database_url

      - name: Run pyright
        run: uv run pyright dj_database_url

  test:
    runs-on: ubuntu-latest
    needs: [formatting, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        django-version: ["5.2", "6.0", "6.1"]
        exclude:
          # django 6.x is not compatible with python 3.11 or lower
          - python-version: "3.11"
            django-version: "6.0"
          - python-version: "3.15"
            django-version: "6.0"
          - python-version: "3.11"
            django-version: "6.1"


    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: 'true'

      - name: Install dependencies
        run: |
          uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Run Tests
        run: |
          echo "$(python --version) / Django $(django-admin --version)"
          uv run coverage run --source=dj_database_url --branch -m unittest discover -v
          uv run coverage report
          uv run coverage xml

      - uses: codecov/codecov-action@v4
